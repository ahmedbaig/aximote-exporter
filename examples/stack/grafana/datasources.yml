apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: aximote-postgres
    uid: aximote-postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: aximote
    jsonData:
      database: aximote
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: $AXIMOTE_PG_PASSWORD
