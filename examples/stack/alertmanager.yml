# Alertmanager for aximote-exporter. Out of the box every alert lands in the
# Alertmanager UI (http://localhost:9093) and goes nowhere else. Uncomment ONE of
# the receivers below, put its name in route.receiver, then:
#
#   docker compose --profile stack restart alertmanager

route:
  receiver: ui-only
  group_by: [alertname, name]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 6h
  routes:
    # Token and API problems need you to act; repeat them more often.
    - matchers: [alertname=~"AximoteTokenRejected|AximoteApiFailing"]
      repeat_interval: 1h

receivers:
  - name: ui-only

  # Discord: Server settings → Integrations → Webhooks → New webhook → Copy URL
  # - name: discord
  #   discord_configs:
  #     - webhook_url: https://discord.com/api/webhooks/<id>/<token>

  # Email (any SMTP server; Gmail needs an app password)
  # - name: email
  #   email_configs:
  #     - to: you@example.com
  #       from: alerts@example.com
  #       smarthost: smtp.example.com:587
  #       auth_username: alerts@example.com
  #       auth_password: <smtp password>

  # Telegram: create a bot with @BotFather, then get your chat id
  # - name: telegram
  #   telegram_configs:
  #     - bot_token: <bot token>
  #       chat_id: <chat id>

  # ntfy (phone push, no account needed): https://ntfy.sh
  # Posts the raw Alertmanager JSON; see the ntfy docs for message templates.
  # - name: ntfy
  #   webhook_configs:
  #     - url: https://ntfy.sh/<pick-a-long-random-topic>

inhibit_rules:
  # If the exporter is down, every staleness alert below it is noise.
  - source_matchers: [alertname="AximoteExporterDown"]
    target_matchers: [alertname=~"Aximote.*Stale"]
